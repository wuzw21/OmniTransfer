[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitransfer"
version = "0.1.0"
description = "Cross-device UI element correspondence and candidate ranking"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest", "ruff", "torch>=2.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnitransfer*"]

[tool.setuptools.package-data]
omnitransfer = [
    "checkpoints/omnitransfer_direct_text_alignment_v9_20260805/*",
    "checkpoints/omnitransfer_spatial_xml_alignment_v9_20260805/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["tests/vector", "tests/scripts", "tests/utg_core"]
