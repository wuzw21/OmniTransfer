[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitransfer"
version = "0.1.0"
description = "Outline repository for mobile UI grounding relocation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
train = ["pyarrow", "datasets"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnitransfer*"]

[tool.setuptools.package-data]
omnitransfer = ["checkpoints/**/*.pt", "checkpoints/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["tests/vector", "tests/scripts", "tests/utg_core"]
