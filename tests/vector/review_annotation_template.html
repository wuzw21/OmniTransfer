<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>OmniTransfer · Unified Review Workbench</title>
<style>
:root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #080b12; color: #edf3fb; }
header { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #2a3347; background: #0c111bdd; backdrop-filter: blur(14px); }
button, select, textarea { border: 1px solid #3a4660; border-radius: 7px; background: #151c29; color: inherit; font: inherit; }
button, select { padding: 7px 10px; cursor: pointer; }
button:hover { border-color: #8195bb; }
button.selected { border-color: #63e6be; background: #183229; }
button:disabled { cursor: default; opacity: .45; }
label.control { display: inline-flex; align-items: center; gap: 5px; color: #aebbd0; font-size: 12px; }
.spacer { flex: 1; }
main { max-width: 1800px; margin: auto; padding: 14px; }
.meta { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 11px; color: #aebbd0; font-size: 13px; }
.screens { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.screens.three-device { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.screens.cluster-review { grid-template-columns: repeat(auto-fit, minmax(min(520px, 100%), 1fr)); align-items: start; }
.screen { min-width: 0; padding: 10px; border: 1px solid #273146; border-radius: 10px; background: #0f151f; }
.screen h3 { margin: 0 0 8px; font-size: 14px; color: #c5d1e4; overflow-wrap: anywhere; }
.image-wrap { overflow: hidden; min-height: 240px; background: #020409; }
.image-stage { position: relative; width: 100%; line-height: 0; }
.image-stage img { display: block; width: 100%; height: auto; }
.overlay { position: absolute; z-index: 4; min-width: 5px; min-height: 5px; border: 3px solid var(--color); background: color-mix(in srgb, var(--color) 18%, transparent); box-shadow: 0 0 0 1px #02040a, 0 4px 12px #000a; pointer-events: none; }
.overlay .tag { position: absolute; left: -2px; top: -24px; padding: 2px 5px; border-radius: 4px; background: #050911e8; color: var(--color); font-size: 11px; font-weight: 750; white-space: nowrap; }
.overlay .point { position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 27px; height: 27px; transform: translate(-50%, -50%); border: 3px solid #050911; border-radius: 50%; background: var(--color); color: #04100d; font-size: 10px; font-weight: 900; box-shadow: 0 0 0 4px color-mix(in srgb, var(--color) 35%, transparent); }
.manual-point { position: absolute; z-index: 8; width: 26px; height: 26px; transform: translate(-50%, -50%); border: 3px solid #050911; border-radius: 50%; background: #ffffff; color: #050911; display: grid; place-items: center; font-size: 10px; font-weight: 900; pointer-events: none; }
.source-query-point { position: absolute; z-index: 10; width: 28px; height: 28px; transform: translate(-50%, -50%); border: 3px solid #050911; border-radius: 50%; background: #ffffff; color: #050911; display: grid; place-items: center; font-size: 10px; font-weight: 900; box-shadow: 0 0 0 5px #63e6be66; pointer-events: none; }
.matcher-point { position: absolute; z-index: 10; width: 30px; height: 30px; transform: translate(-50%, -50%); border: 3px solid #050911; border-radius: 50%; background: #55c2ff; color: #050911; display: grid; place-items: center; font-size: 10px; font-weight: 900; box-shadow: 0 0 0 5px #55c2ff66; pointer-events: none; }
.method-point { position: absolute; z-index: 11; width: 32px; height: 28px; transform: translate(-50%, -50%); border: 3px solid #050911; border-radius: 50%; color: #050911; display: grid; place-items: center; font-size: 9px; font-weight: 900; box-shadow: 0 0 0 4px color-mix(in srgb, var(--method-color) 38%, transparent); pointer-events: none; }
.method-point.ours { --method-color: #55c2ff; background: #55c2ff; }
.method-point.selector { --method-color: #ff70c7; background: #ff70c7; }
.method-toggle { display: none; }
.method-toggle.visible { display: inline-block; }
.payload-point { position: absolute; z-index: 9; width: 30px; height: 30px; transform: translate(-50%, -50%); border: 3px solid #050911; border-radius: 50%; background: var(--color); color: #050911; display: grid; place-items: center; font-size: 10px; font-weight: 900; box-shadow: 0 0 0 5px color-mix(in srgb, var(--color) 38%, transparent); pointer-events: none; }
.multi-mapping-list { display: grid; gap: 7px; margin-top: 10px; }
.multi-mapping-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px; border: 1px solid #29354c; border-left: 4px solid var(--mapping-color); border-radius: 8px; background: #0b1019; cursor: pointer; }
.multi-mapping-row.selected { border-color: var(--mapping-color); box-shadow: 0 0 0 2px color-mix(in srgb, var(--mapping-color) 28%, transparent); }
.multi-mapping-chip { display: inline-grid; place-items: center; min-width: 42px; padding: 3px 6px; border-radius: 999px; background: var(--mapping-color); color: #04100d; font-weight: 800; font-size: 11px; }
.multi-mapping-row .mapping-label { min-width: 0; overflow-wrap: anywhere; }
.multi-mapping-row .mapping-status { color: #aebbd0; font-size: 11px; white-space: nowrap; }
.multi-overlay { border-width: 3px; }
.multi-overlay .tag { font-weight: 850; }
.source { --color: #63e6be; }
.gold { --color: #ffd166; }
.matcher { --color: #55c2ff; }
.selector { --color: #ff70c7; }
.candidate { --color: #aebbd0; opacity: .42; border-width: 1px; box-shadow: none; }
.candidate .tag, .candidate .point { display: none; }
.details { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(330px, .75fr); gap: 14px; margin-top: 14px; }
.card { padding: 12px; border: 1px solid #273146; border-radius: 10px; background: #0f151f; }
.card h3 { margin: 0 0 10px; font-size: 14px; }
.diagnostics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.diagnostic { min-width: 0; padding: 9px; border: 1px solid #29354c; border-radius: 8px; background: #0b1019; color: #b7c4d8; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.diagnostic strong { display: block; margin-bottom: 5px; color: #eef4fb; }
.tag-chip { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 6px; border-radius: 999px; background: #222d42; color: #bbcae3; font-size: 11px; }
.review-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.review-buttons button { min-height: 42px; text-align: left; }
textarea { width: 100%; min-height: 92px; margin-top: 9px; padding: 8px; resize: vertical; }
.legend { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 8px; color: #aebbd0; font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; background: var(--color); }
.muted { color: #8998b0; }
.timing-summary { color: #91a2bb; font-size: 12px; white-space: nowrap; }
.live-mapping-status { color: #63e6be; font-size: 12px; white-space: nowrap; }
.cluster-group { min-width: 0; padding: 10px; border: 1px solid #273146; border-radius: 10px; background: #0f151f; }
.cluster-group > h3 { margin: 0 0 8px; font-size: 14px; }
.cluster-members { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 8px; }
.cluster-member { position: relative; min-width: 0; padding: 7px; border: 1px solid #29354c; border-radius: 8px; background: #0b1019; cursor: pointer; transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease; }
.cluster-member:hover { border-color: #627493; transform: translateY(-1px); }
.cluster-member.selected-page { border-color: #ff7b72; box-shadow: 0 0 0 2px #ff7b7244; }
.cluster-member:focus-visible { outline: 2px solid #63e6be; outline-offset: 2px; }
.exclude-page { position: absolute; z-index: 12; top: 5px; right: 5px; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border-color: #6d3940; background: #29151aee; color: #ff9b94; font-size: 18px; line-height: 1; }
.exclude-page:hover { border-color: #ff7b72; background: #4a2027; }
.cluster-member h4 { margin: 0 0 6px; color: #c5d1e4; font-size: 11px; overflow-wrap: anywhere; }
.cluster-member .image-wrap { display: grid; place-items: center; height: clamp(170px, 30vh, 340px); min-height: 0; }
.cluster-member .image-wrap { position: relative; overflow: hidden; }
.cluster-member .image-stage { position: absolute; inset: 0; width: auto; height: auto; min-height: 0; }
.cluster-member .image-stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cluster-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; color: #aebbd0; font-size: 11px; }
.transition-details { margin-top: 6px; color: #aebbd0; font-size: 11px; }
.transition-details summary { cursor: pointer; color: #91a2bb; }
.transition-list { max-height: 130px; overflow: auto; margin-top: 6px; line-height: 1.45; }
.pairwise-details { margin-top: 6px; }
.pairwise-details summary { cursor: pointer; color: #91a2bb; }
.cluster-protocol { height: 100vh; overflow: hidden; }
.cluster-protocol header { position: relative; flex-wrap: nowrap; height: 56px; padding: 8px 12px; overflow-x: auto; }
.cluster-protocol header strong, .cluster-protocol header button, .cluster-protocol header select, .cluster-protocol .timing-summary { flex: 0 0 auto; white-space: nowrap; }
.cluster-protocol header .control, .cluster-protocol #clearSource, .cluster-protocol #clearPoints { display: none; }
.cluster-protocol main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(150px, 0.55fr); gap: 7px; height: calc(100vh - 56px); max-width: none; padding: 8px 12px; overflow: hidden; }
.cluster-protocol .meta { margin: 0; }
.cluster-protocol .screens { min-height: 0; overflow: auto; }
.cluster-protocol .cluster-group { min-height: 0; overflow: auto; }
.cluster-protocol .cluster-member .image-wrap { height: clamp(170px, 34vh, 280px); }
.cluster-protocol .legend { margin: 0; }
.cluster-protocol .details { min-height: 0; margin: 0; overflow: hidden; }
.cluster-protocol .details .card { min-height: 0; overflow: auto; }
.minimal-mapping-review .details { grid-template-columns: minmax(0, 1fr) minmax(330px, 520px); }
.minimal-mapping-review .meta { display: none; }
.minimal-mapping-review #clearSource, .minimal-mapping-review header .control { display: none; }
.minimal-mapping-review .legend span::before { display: none; }
@media (max-width: 980px) { .screens, .details, .diagnostics { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <strong>OmniTransfer · Unified Review Workbench</strong>
  <span id="progress"></span>
  <button id="previous">上一条</button>
  <button id="next">下一条</button>
  <select id="stageFilter" hidden aria-label="审核阶段"><option value="cluster_audit" selected>Cluster 筛选</option><option value="cluster_merge_candidate">Cluster 合并候选</option><option value="all">全部阶段</option></select>
  <select id="filter"><option value="all">全部</option><option value="pending">未审核</option><option value="confirmed">已审核</option></select>
  <select id="methodFilter" hidden aria-label="方法差异"><option value="all">所有方法组</option><option value="ours_vs_selector_disagree">只看 ours ≠ selector</option><option value="ours_correct_selector_wrong">只看我们的对 / selector 错</option><option value="selector_correct_ours_wrong">只看 selector 对 / 我们的错</option><option value="ours_rank_advantage">只看我们的排序更靠前</option><option value="selector_rank_advantage">只看 selector 排序更靠前</option></select>
  <button id="showOurs" class="method-toggle" type="button">1 · 我们的方案</button>
  <button id="showSelector" class="method-toggle" type="button">2 · selector</button>
  <span id="methodOverlayStatus" class="method-toggle"></span>
  <button id="restoreExcluded" hidden>恢复最近排除</button>
  <label class="control"><input type="checkbox" id="showCandidates">显示全部可选节点</label>
  <button id="clearSource">重置 Source</button>
  <button id="clearPoints">清空人工点</button>
  <span class="timing-summary" id="timingSummary"></span>
  <span class="live-mapping-status" id="liveMappingStatus"></span>
  <span class="spacer"></span>
  <button id="export">导出审核 JSONL</button>
</header>
<main>
  <div class="meta"><div id="identity"></div><div id="difficulty"></div></div>
  <div class="screens" id="screens"><section class="screen" id="sourcePanel"></section><section class="screen" id="targetPanel"></section><section class="screen" id="foldPanel" hidden></section></div>
  <div class="legend" id="legend"></div>
  <div class="details">
    <section class="card"><h3>方法诊断</h3><div class="diagnostics" id="diagnostics"></div></section>
    <section class="card"><h3>人工裁决</h3><div class="review-buttons" id="reviewButtons"></div><textarea id="notes" placeholder="备注：错误原因、歧义、遮挡、页面不一致等"></textarea><div class="muted" id="saved"></div></section>
  </div>
</main>
<script type="module">
async function loadPayload() {
  try {
    return await (async () => (__OMNITRANSFER_REVIEW_PAYLOAD__))();
  } catch (embeddedError) {
    try {
      return await fetch('./review.html.payload.json').then(response => response.json());
    } catch (sidecarError) {
      return {summary:{schema_version:'omnitransfer.review_template.v1',review_ui:{protocol:'empty'}},pairs:[]};
    }
  }
}
const payload = await loadPayload();
const summary = payload.summary || {};
let queue = payload.pairs || [];
const pagePairReview = summary.review_ui?.protocol === 'page_pair_prior';
const multiMappingReview = summary.review_ui?.protocol === 'mapping_pair_correspondence' && summary.review_ui?.multi_mapping === true;
const queryParams = new URLSearchParams(location.search);
const unifiedManualMode = queryParams.get('unified_manual') === '1';
const remainingManualQuery = queryParams.get('remaining_manual');
const remainingManualMode = unifiedManualMode || remainingManualQuery === '1' || (remainingManualQuery !== '0' && multiMappingReview && summary.review_ui?.live_mapping !== false);
const iconVisualReview = summary.review_ui?.protocol === 'icon_visual_review';
const utgPageMerge = summary.review_ui?.protocol === 'utg_page_merge';
const utgClusterReview = summary.review_ui?.protocol === 'utg_cluster_review';
const minimalMappingReview = summary.review_ui?.minimal === true;
const fixedSourceReview = summary.review_ui?.fixed_source === true;
if (unifiedManualMode && multiMappingReview) {
  try {
    const manualIndex = payload.unified_manual_index || await fetch('./review.html.unified_manual.index.json').then(response => response.json());
    const baseQueue = queue.slice();
    summary.schema_version = 'omnitransfer.unified_error_review.v1';
    summary.review_ui = {
      ...(summary.review_ui || {}),
      protocol: 'mapping_pair_correspondence',
      multi_mapping: true,
      template_ids: ['correct_correspondence', 'wrong_correspondence', 'ambiguous_or_absent'],
      template_overrides: {
        correct_correspondence: '接受 / 可点击',
        wrong_correspondence: '错误 / 不可点击',
        ambiguous_or_absent: '仍需核对',
      },
    };
    queue = (manualIndex.rows || []).map((item, index) => {
      const task = baseQueue.find(row => row.pair_id === item.pair_id);
      const mapping = task?.mappings?.find(row => row.source_label === item.source_label);
      if (!task || !mapping) return null;
      const oursNode = item.ours_node || task.target?.candidates?.find(node => node.node_id === item.ours_node_id) || null;
      return {
        ...task,
        task_id: `unified-error:${index + 1}:${item.pair_id}:${item.source_label}`,
        review_meta: item,
        method_tags: [{id: item.review_group || 'unified_error', label: item.reason_label || item.review_group || '统一错误审阅', count: 1}],
        mappings: [{...mapping, mapping_id: `unified-error:${index + 1}`, ours_target_node: oursNode}],
        verdict_ids: ['correct_correspondence', 'wrong_correspondence', 'ambiguous_or_absent'],
      };
    }).filter(Boolean);
  } catch (error) {
    summary.schema_version = 'omnitransfer.unified_error_review.missing_index';
    queue = [];
    document.body.dataset.reviewLoadError = String(error?.message || error);
  }
}
document.body.classList.toggle('cluster-protocol', utgClusterReview);
document.body.classList.toggle('minimal-mapping-review', minimalMappingReview);
const idleThresholdMs = Number(summary.review_ui?.idle_threshold_ms || 10000);
const storageKey = `omnitransfer-review:${summary.schema_version || 'v1'}:${summary.checkpoint || location.pathname}`;
const exclusionStorageKey = `${storageKey}:excluded-pages`;
let annotations = JSON.parse(localStorage.getItem(storageKey) || '{}');
let excludedPages = JSON.parse(localStorage.getItem(exclusionStorageKey) || '{}');
let filtered = queue.slice();
let index = 0;
let selectedPageKey = null;
let visibleTaskId = null;
let visibleIntervalStartedAt = null;
let selectedMappingId = null;
let methodOverlayMode = 'ours';
const mappingPalette = ['#63e6be','#ffd166','#55c2ff','#ff70c7','#ff7b72','#b197fc','#8ce99a','#ffa94d','#74c0fc','#f783ac','#a9e34b','#e599f7'];
const byId = value => document.getElementById(value);
const methodOptions = new Map();
queue.flatMap(task => task.method_tags || []).forEach(tag => {
  const id = typeof tag === 'string' ? tag : tag?.id;
  const label = typeof tag === 'string' ? tag : (tag?.label || tag?.id);
  if (id) methodOptions.set(id,label);
});
const existingMethodOptions = new Set([...byId('methodFilter').options].map(option => option.value));
methodOptions.forEach((label,id) => {
  if (existingMethodOptions.has(id)) return;
  const option = document.createElement('option');
  option.value = id;
  option.textContent = `只看 ${label}`;
  byId('methodFilter').append(option);
});
byId('stageFilter').hidden = !utgClusterReview;
byId('methodFilter').hidden = !queue.some(task => (task.method_tags || []).length);
const hasMethodComparison = queue.some(task => task.method_comparison);
byId('showOurs').classList.toggle('visible', hasMethodComparison);
byId('showSelector').classList.toggle('visible', hasMethodComparison);
byId('methodOverlayStatus').classList.toggle('visible', hasMethodComparison);
byId('clearSource').hidden = fixedSourceReview;
byId('showCandidates').closest('label').hidden = summary.review_ui?.show_candidate_toggle === false;
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const label = node => node?.text || node?.content_desc || node?.resource_id || node?.class_name || node?.node_id || 'NULL';
const overlayLabel = node => node?.node_id ? `${node.node_id} · ${label(node).slice(0,28)}` : label(node);
function save() { localStorage.setItem(storageKey, JSON.stringify(annotations)); }
function saveExclusions() { localStorage.setItem(exclusionStorageKey, JSON.stringify(excludedPages)); }
function annotation(task) { return annotations[task.task_id] || {}; }
function setAnnotation(task, patch) { annotations[task.task_id] = {...annotation(task), ...patch, updated_at: new Date().toISOString()}; save(); render(); }
function migrateLegacyLiveState() {
  let changed = false;
  Object.values(annotations).forEach(review => {
    const clear = value => {
      if (value?.live_ours_error !== 'http_501') return;
      delete value.live_ours_error;
      delete value.live_ours_status;
      delete value.live_ours_node_id;
      delete value.live_ours_request_id;
      changed = true;
    };
    clear(review);
    const clearStaleCoordinates = value => {
      if (!value?.source_point || value.mapping_coordinate_contract === 'graph_visual_v3_manual_click') return;
      delete value.source_node_id;
      delete value.source_point;
      delete value.live_ours_node_id;
      delete value.live_ours_status;
      delete value.live_ours_request_id;
      delete value.live_ours_probability;
      delete value.live_ours_margin;
      delete value.live_ours_point;
      delete value.live_ours_error;
      delete value.live_ours_release;
      value.mapping_coordinate_contract = 'graph_visual_v3_manual_click';
      changed = true;
    };
    clearStaleCoordinates(review);
    Object.values(review?.mappings || {}).forEach(value => { clear(value); clearStaleCoordinates(value); });
  });
  if (changed) save();
}
function pageKey(page) { return page?.page_key || `${page?.device_role || page?.device_serial || 'device'}:${page?.page_id || 'page'}`; }
function isExcluded(page) { return Boolean(excludedPages[pageKey(page)]); }
function visibleMembers(cluster) { return (cluster?.members || []).filter(page => !isExcluded(page)); }
function taskExcludedPageKeys(task) {
  return [...new Set((task.clusters || []).flatMap(cluster => (cluster.members || []).map(pageKey)).filter(key => excludedPages[key]))];
}
function taskAutoExcludedPageKeys(task) {
  return [...new Set((task.clusters || []).flatMap(cluster => (cluster.excluded_members || []).map(member => member.page_key)))];
}
function updateExclusionControls() {
  const keys = Object.keys(excludedPages);
  const restore = byId('restoreExcluded');
  restore.hidden = !utgClusterReview;
  restore.disabled = keys.length === 0;
  restore.textContent = keys.length ? `恢复最近排除（${keys.length}）` : '恢复最近排除';
}
function selectPage(key) {
  selectedPageKey = key;
  document.querySelectorAll('.cluster-member').forEach(card => {
    const selected = card.dataset.pageKey === key;
    card.classList.toggle('selected-page', selected);
    card.setAttribute('aria-selected', String(selected));
  });
}
function excludePage(key) {
  if (!utgClusterReview || !key || excludedPages[key]) return;
  if (filtered.length) recordActivity(filtered[index], 'page_exclude');
  excludedPages[key] = {excluded_at:new Date().toISOString()};
  selectedPageKey = null;
  saveExclusions();
  applyFilter(true);
}
function restoreLatestExcluded() {
  const latest = Object.entries(excludedPages).sort((left, right) => String(right[1]?.excluded_at || '').localeCompare(String(left[1]?.excluded_at || '')))[0];
  if (!latest) return;
  delete excludedPages[latest[0]];
  selectedPageKey = latest[0];
  saveExclusions();
  applyFilter(true);
}
function timingRecord(task) {
  const review = annotation(task), now = new Date().toISOString();
  if (!review.timing) review.timing = {item_first_visible_at:now,item_last_visible_at:now,first_interaction_at:null,decision_started_at:null,visible_intervals:[],activity_events:[],revisit_count:0,verdict_change_count:0,candidate_click_count:0,notes_edit_count:0,visibility_pause_count:0};
  return review.timing;
}
function closeVisibleInterval(at = new Date().toISOString()) {
  if (!visibleTaskId || !visibleIntervalStartedAt) return;
  const task = queue.find(row => row.task_id === visibleTaskId);
  if (!task) return;
  const timing = timingRecord(task);
  timing.visible_intervals.push({start:visibleIntervalStartedAt,end:at});
  timing.item_last_visible_at = at;
  visibleIntervalStartedAt = null;
  save();
}
function showTaskTiming(task) {
  if (visibleTaskId === task.task_id && visibleIntervalStartedAt) return;
  const now = new Date().toISOString();
  if (visibleTaskId && visibleTaskId !== task.task_id) closeVisibleInterval(now);
  const timing = timingRecord(task);
